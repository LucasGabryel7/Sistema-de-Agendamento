# Conexão com o PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
# A senha NÃO fica aqui: vem da variável DB_SENHA, definida no arquivo .env
# (o .env está no .gitignore, então nunca vai para o GitHub)
quarkus.datasource.password=${DB_SENHA}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/manicure_db

# Em desenvolvimento, o Hibernate cria as tabelas sozinho.
# "drop-and-create" apaga tudo a cada reinício, ótimo para testes.
quarkus.hibernate-orm.database.generation=drop-and-create

# Carrega dados iniciais do arquivo import.sql ao subir a aplicação
quarkus.hibernate-orm.sql-load-script=import.sql