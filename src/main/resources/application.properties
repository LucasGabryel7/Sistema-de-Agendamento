# Conexão com o PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
# A senha NÃO fica aqui: vem da variável DB_SENHA, definida no arquivo .env
# (o .env está no .gitignore, então nunca vai para o GitHub)
quarkus.datasource.password=${DB_SENHA}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/manicure_db

# Mantém os dados entre reinícios e atualiza o esquema das tabelas conforme as entidades
quarkus.hibernate-orm.schema-management.strategy=update

# Desativa a carga automática de arquivos SQL na inicialização (dados são inseridos via código se o banco estiver vazio)
quarkus.hibernate-orm.sql-load-script=no-file

# ---------------------------------------------------------------
# PERFIL DE TESTES (%test.): só vale quando rodamos os testes.
# Usa um banco separado (manicure_test) para nunca mexer nos dados reais.
# Usuário e senha continuam os mesmos, definidos acima.
# ---------------------------------------------------------------
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/manicure_test

# Nos testes, o banco é apagado e recriado a cada execução (começa sempre limpo)
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
